name: CI Pipeline

on:
  push:
    branches:
      - main
      - phase-**
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Alembic Fresh Database Migration
        run: |
          alembic -x db_url=sqlite:///ci_migration_test.db upgrade head

      - name: Run Model Verification
        run: |
          pytest tests/test_model_verification.py -v

      - name: Run Isolated Backend Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///ci_test.db
        run: |
          pytest -v \
            tests/test_code_consolidation.py \
            tests/test_database_migrations_phase2.py \
            tests/test_environment_profiles.py \
            tests/test_websocket_reliability.py \
            tests/test_cors_configuration.py \
            tests/test_prediction_idempotency.py \
            tests/test_v7_compat_runtime_parity.py \
            tests/test_system_status.py \
            tests/test_model_verification.py \
            tests/test_phase1_security_authorization.py \
            tests/test_complaint_intake_e2e.py \
            tests/test_backend.py

      - name: Run Phase 2-6 Remediation Regression Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///ci_phase_regression.db
        run: |
          pytest -v \
            tests/test_phase2_timestamp_and_scores.py \
            tests/test_phase3_hotspots_and_gis.py \
            tests/test_phase4_model_performance.py \
            tests/test_phase5_lime_explainability.py \
            tests/test_phase6_graph_contracts.py

  blockchain-tests:
    name: Blockchain & Ledger Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Blockchain & Prediction Audit Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///ci_bc_test.db
        run: |
          pytest tests/test_blockchain_feature_parity.py tests/test_blockchain_signal_causality_audit.py -v

  frontend-build:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build & Typecheck Frontend
        run: npm run build
