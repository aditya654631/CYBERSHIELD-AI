[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast in-memory unit tests with zero external dependencies
    integration: API and database integration tests with isolated test database
    ml: Machine learning model inference, parity, and feature pipeline tests
    blockchain: Hyperledger Fabric gateway and feature contract tests
    live: Tests requiring live cloud or external infrastructure (opt-in via --run-live)

filterwarnings =
    ignore::DeprecationWarning:datetime.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::sklearn.exceptions.InconsistentVersionWarning
    ignore::starlette.testclient.StarletteDeprecationWarning
