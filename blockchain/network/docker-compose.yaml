      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.cybershield.net:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.cybershield.net:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.cybershield.net:8051
      - CORE_PEER_LOCALMSPID=BankBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
