      - ./organizations/peerOrganizations/bankb.cybershield.net/peers/peer0.bankb.cybershield.net/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bankb.cybershield.net/peers/peer0.bankb.cybershield.net/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8051:8051
      - 9445:9445
    networks:
      - cybershield_fabric

