      - CORE_PEER_CHAINCODEADDRESS=peer0.i4c.cybershield.net:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.i4c.cybershield.net:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.i4c.cybershield.net:10051
      - CORE_PEER_LOCALMSPID=I4CMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9447
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
