# ==============================================================================
# CyberShield AI — 24×7 Cloud VPS Hyperledger Fabric Consortium Stack
# Organizations: BankA, BankB, BankC, I4C, LEA (Simulated Prototype Orgs)
# Channel: cyber-intelligence
# Storage: Dedicated Named Volumes for Orderer and Peer Ledgers
# ==============================================================================

version: '3.8'

networks:
  cybershield_fabric:
    name: cybershield_fabric

volumes:
  orderer_ledger:
    name: cybershield_orderer_ledger
  banka_ledger:
    name: cybershield_banka_ledger
  bankb_ledger:
    name: cybershield_bankb_ledger
  bankc_ledger:
    name: cybershield_bankc_ledger
  i4c_ledger:
    name: cybershield_i4c_ledger
  lea_ledger:
    name: cybershield_lea_ledger
  caddy_data:
    name: cybershield_caddy_data
  caddy_config:
    name: cybershield_caddy_config

services:
  # ============================================================================
  # ORDERER SERVICE
  # ============================================================================
  orderer.cybershield.net:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.cybershield.net
    restart: unless-stopped
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - orderer_ledger:/var/hyperledger/production/orderer
      - ../network/organizations/ordererOrganizations/cybershield.net/orderers/orderer.cybershield.net/msp:/var/hyperledger/orderer/msp:ro
      - ../network/organizations/ordererOrganizations/cybershield.net/orderers/orderer.cybershield.net/tls:/var/hyperledger/orderer/tls:ro
    ports:
      - "127.0.0.1:7050:7050"
      - "127.0.0.1:7053:7053"
      - "127.0.0.1:9443:9443"
    networks:
      - cybershield_fabric

  # ============================================================================
  # PEER 0 — BANK A
  # ============================================================================
  peer0.banka.cybershield.net:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.banka.cybershield.net
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cybershield_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.banka.cybershield.net
      - CORE_PEER_ADDRESS=peer0.banka.cybershield.net:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.cybershield.net:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.cybershield.net:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.cybershield.net:7051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - banka_ledger:/var/hyperledger/production
      - ../network/organizations/peerOrganizations/banka.cybershield.net/peers/peer0.banka.cybershield.net/msp:/etc/hyperledger/fabric/msp:ro
      - ../network/organizations/peerOrganizations/banka.cybershield.net/peers/peer0.banka.cybershield.net/tls:/etc/hyperledger/fabric/tls:ro
    ports:
      - "127.0.0.1:7051:7051"
      - "127.0.0.1:9444:9444"
    networks:
      - cybershield_fabric

  # ============================================================================
  # PEER 0 — BANK B
  # ============================================================================
  peer0.bankb.cybershield.net:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.bankb.cybershield.net
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cybershield_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankb.cybershield.net
      - CORE_PEER_ADDRESS=peer0.bankb.cybershield.net:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.cybershield.net:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.cybershield.net:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.cybershield.net:8051
      - CORE_PEER_LOCALMSPID=BankBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - bankb_ledger:/var/hyperledger/production
      - ../network/organizations/peerOrganizations/bankb.cybershield.net/peers/peer0.bankb.cybershield.net/msp:/etc/hyperledger/fabric/msp:ro
      - ../network/organizations/peerOrganizations/bankb.cybershield.net/peers/peer0.bankb.cybershield.net/tls:/etc/hyperledger/fabric/tls:ro
    ports:
      - "127.0.0.1:8051:8051"
      - "127.0.0.1:9445:9445"
    networks:
      - cybershield_fabric

  # ============================================================================
  # PEER 0 — BANK C
  # ============================================================================
  peer0.bankc.cybershield.net:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.bankc.cybershield.net
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cybershield_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankc.cybershield.net
      - CORE_PEER_ADDRESS=peer0.bankc.cybershield.net:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankc.cybershield.net:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankc.cybershield.net:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankc.cybershield.net:9051
      - CORE_PEER_LOCALMSPID=BankCMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - bankc_ledger:/var/hyperledger/production
      - ../network/organizations/peerOrganizations/bankc.cybershield.net/peers/peer0.bankc.cybershield.net/msp:/etc/hyperledger/fabric/msp:ro
      - ../network/organizations/peerOrganizations/bankc.cybershield.net/peers/peer0.bankc.cybershield.net/tls:/etc/hyperledger/fabric/tls:ro
    ports:
      - "127.0.0.1:9051:9051"
      - "127.0.0.1:9446:9446"
    networks:
      - cybershield_fabric

  # ============================================================================
  # PEER 0 — I4C (Indian Cybercrime Coordination Centre)
  # ============================================================================
  peer0.i4c.cybershield.net:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.i4c.cybershield.net
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cybershield_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.i4c.cybershield.net
      - CORE_PEER_ADDRESS=peer0.i4c.cybershield.net:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.i4c.cybershield.net:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.i4c.cybershield.net:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.i4c.cybershield.net:10051
      - CORE_PEER_LOCALMSPID=I4CMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9447
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - i4c_ledger:/var/hyperledger/production
      - ../network/organizations/peerOrganizations/i4c.cybershield.net/peers/peer0.i4c.cybershield.net/msp:/etc/hyperledger/fabric/msp:ro
      - ../network/organizations/peerOrganizations/i4c.cybershield.net/peers/peer0.i4c.cybershield.net/tls:/etc/hyperledger/fabric/tls:ro
    ports:
      - "127.0.0.1:10051:10051"
      - "127.0.0.1:9447:9447"
    networks:
      - cybershield_fabric

  # ============================================================================
  # PEER 0 — LEA (Law Enforcement Agencies)
  # ============================================================================
  peer0.lea.cybershield.net:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.lea.cybershield.net
    restart: unless-stopped
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=cybershield_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.lea.cybershield.net
      - CORE_PEER_ADDRESS=peer0.lea.cybershield.net:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.lea.cybershield.net:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lea.cybershield.net:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lea.cybershield.net:11051
      - CORE_PEER_LOCALMSPID=LEAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9448
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - lea_ledger:/var/hyperledger/production
      - ../network/organizations/peerOrganizations/lea.cybershield.net/peers/peer0.lea.cybershield.net/msp:/etc/hyperledger/fabric/msp:ro
      - ../network/organizations/peerOrganizations/lea.cybershield.net/peers/peer0.lea.cybershield.net/tls:/etc/hyperledger/fabric/tls:ro
    ports:
      - "127.0.0.1:11051:11051"
      - "127.0.0.1:9448:9448"
    networks:
      - cybershield_fabric

  # ============================================================================
  # CYBERSHIELD FABRIC GATEWAY SERVICE
  # ============================================================================
  gateway.cybershield.net:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: gateway.cybershield.net
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=4000
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_AUTH_TOKEN=${GATEWAY_AUTH_TOKEN:-}
      - FABRIC_NETWORK_DIR=/opt/cybershield/blockchain/network
      - BANKA_PEER_ENDPOINT=peer0.banka.cybershield.net:7051
      - BANKB_PEER_ENDPOINT=peer0.bankb.cybershield.net:8051
      - BANKC_PEER_ENDPOINT=peer0.bankc.cybershield.net:9051
      - I4C_PEER_ENDPOINT=peer0.i4c.cybershield.net:10051
      - LEA_PEER_ENDPOINT=peer0.lea.cybershield.net:11051
    volumes:
      - ../network:/opt/cybershield/blockchain/network:ro
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - cybershield_fabric
    depends_on:
      - orderer.cybershield.net
      - peer0.banka.cybershield.net
      - peer0.bankb.cybershield.net
      - peer0.bankc.cybershield.net
      - peer0.i4c.cybershield.net
      - peer0.lea.cybershield.net

  # ============================================================================
  # CADDY REVERSE PROXY & AUTOMATED TLS
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy.cybershield.net
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cybershield_fabric
    depends_on:
      - gateway.cybershield.net
